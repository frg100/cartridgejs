# Publish all packages to npm when you push a version tag (v0.1.0, v0.2.0-beta.1, ...).
# Needs the repository secret NPM_TOKEN (an npm "Automation" or granular token with publish rights
# for the @cartridgejs scope and create-cartridgejs). See RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and check only; do not publish
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      - name: Tag must match package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in packages/*/package.json; do
            V=$(node -p "require('./$f').version")
            [ "$V" = "$TAG" ] || { echo "::error::$f is $V, tag is $TAG"; exit 1; }
          done

      - name: Check the packed packages (and build a new game from them)
        run: node scripts/check-pack.mjs --e2e

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance needs a public repository.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
        run: |
          ARGS="--access public --no-git-checks"
          case "$GITHUB_REF_NAME" in *-*) ARGS="$ARGS --tag next";; esac
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          pnpm -r --filter "./packages/*" publish $ARGS
